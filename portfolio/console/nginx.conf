server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall through to the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames make them safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin proxy to the three services, matching the Vite dev proxy so the
    # console never needs a per-environment base URL.
    location /api/rag/   { proxy_pass http://groundedcorp:8001/; }
    location /api/agents/ { proxy_pass http://agentforge:8002/; }
    location /api/guard/ { proxy_pass http://guardrailops:8003/; }
}
